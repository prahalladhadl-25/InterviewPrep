spring:
  application:
    name: graphql-demo
  
  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # H2 Console (for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # SQL Initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# GraphQL Configuration
spring.graphql:
  graphiql:
    enabled: true
    path: /graphiql
  path: /graphql
  schema:
    printer:
      enabled: true

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    org.springframework.graphql: DEBUG
    com.example: DEBUG

